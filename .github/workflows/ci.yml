# uv gate matrix: 3.12/3.13 stable + 3.14 as experimental allowed-fail leg,
# pyright strict, ruff, coverage >=90. Monthly bitrot cron.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 1 * *" # monthly bitrot

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.12"
            experimental: false
          - python-version: "3.13"
            experimental: false
          - python-version: "3.14"
            experimental: true
    continue-on-error: ${{ matrix.experimental }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --frozen
      - run: make typecheck
      - run: make test

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: make fmt-check
      - run: make lint

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen
      - run: make docs

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: ./scripts/check-contract.sh

  # Loop 1: macOS + Windows legs — the shared gates run on Linux; these prove
  # the workspace resolves, typechecks, and tests on the other platforms.
  cross-platform:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen
      - run: uv run pytest -q

  # Loop 2: performance budget - blocking since it stayed green for a full
  # loop (LOOP.md graduation policy). Same scripts/ command a developer runs
  # locally; never a CI-only measurement path.
  perf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen
      - run: make bench

  # Loop 3: determinism verification - blocking since it stayed green for a
  # full loop, and since measurement showed every toolchain in the estate is
  # byte-reproducible (ADR: determinism verification). Same scripts/ command a
  # developer runs locally.
  repro:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen
      - run: make repro
