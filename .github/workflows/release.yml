# Tag → uv build → attest → PyPI trusted publishing (OIDC). Configure the
# "pypi" environment + a pending publisher on pypi.org per package first.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'WyattAu' }}
    environment: pypi
    permissions:
      id-token: write
      attestations: write
      contents: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2  # v2.22.2
        with:
          # audit mode: egress is logged, not blocked -- evidence first,
          # enforcement after review (OMNI-CORE 11j, research note 42).
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # enable-cache: false -- a tag-triggered publish must not write or read
      # runtime caches: caches survive beyond the run, so anything a publish
      # job cached could be poisoned by an earlier run (zizmor cache-poisoning,
      # found live on this advisory job in loop 28 and still unreported).
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          enable-cache: false
      - run: uv build --package omni-core
      - run: uv build --package omnistats
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: "dist/*.tar.gz"
      - name: publish
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
      # The GitHub Release is the changelog surface for people who never visit
      # PyPI; notes are generated from the commits since the previous tag.
      - name: github release
        uses: softprops/action-gh-release@5113cdc90fd4d541c801c55356214017bf5ae34b  # v3
        with:
          generate_release_notes: true

  sbom:
    name: SBOM (CycloneDX)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # SBOM of the dependency graph ships with the release (research note 40).
      - name: generate SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c  # v0.24.3
        with:
          format: cyclonedx-json
          output-file: sbom.cdx.json
          upload-artifact: true
