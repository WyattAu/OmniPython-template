[project]
name = "omnistats"
version = "0.1.0"
description = "Example domain package composing on omni-core (internal dependency demo)"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Wyatt Au", email = "wyatt_au@protonmail.com" }]
dependencies = ["omni-core"]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-cov>=6.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/omnistats"]

[tool.uv.sources]
omni-core = { workspace = true }
