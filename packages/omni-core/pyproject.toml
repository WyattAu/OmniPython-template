[project]
name = "omni-core"
version = "0.1.0"
description = "Leaf primitives for the OmniPython workspace (L0 pattern: zero workspace deps)"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Wyatt Au", email = "wyatt_au@protonmail.com" }]
dependencies = []

[dependency-groups]
dev = ["pytest>=8.3", "pytest-cov>=6.0", "hypothesis>=6.100"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/omni_core"]
